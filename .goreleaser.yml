version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agentmeter
    main: .
    binary: agentmeter
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: unix
    ids:
      - agentmeter
    formats:
      - tar.gz
    builds_info:
      group: root
      owner: root
    files:
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - LICENSE
      - assets/*
      - examples/*
      - templates/*
      - static/**/*
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
