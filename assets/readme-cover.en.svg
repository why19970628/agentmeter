      .cardTitle{font:800 28px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f0f7f7}
      .cardText{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#d7e2e4}
      .small{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#94a4ad}
      .mono{font:500 20px Menlo,Consolas,monospace;fill:#edf7f3}
      .monoHead{font:600 17px Menlo,Consolas,monospace;fill:#dbe7e7}
      .line{stroke:#78eecb;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .mutedLine{stroke:#425462;stroke-width:1.2}
    </style>
