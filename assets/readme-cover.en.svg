<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060910"/>
      <stop offset="0.55" stop-color="#0b111b"/>
      <stop offset="1" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="greenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df4ce"/>
      <stop offset="1" stop-color="#8ebcff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd48a"/>
      <stop offset="1" stop-color="#f4a85b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
